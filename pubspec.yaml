name: lingua_go
description: "LinguaGo - App para aprender idiomas en línea (Proyecto final)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.0.0
  flutter_dotenv: ^6.0.1
  http: ^1.2.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  sensors_plus: ^6.0.0
  flutter_tts: ^4.2.3
  audioplayers: ^6.1.0
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"

  adaptive_icon_background: "#7B35E8"
  adaptive_icon_foreground: "assets/icon/logo.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/
    - assets/imagenes/
    - assets/audios/
    - assets/sonidos/
